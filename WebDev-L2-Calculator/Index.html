<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
   
</head>
<body>
    <div class="container">
    <div class="input-box">
        <input type="text" id="display">
    <button class="fa-solid fa-clock-rotate-left" onclick="showHistory()" id="btn-history"></button>
    
    </div>
    
    
    <div class="first">
    <button onclick="setDegree()" class="btn">Deg</button>
    <button onclick="setRadian()" class="btn">Rad</button>
    <button onclick="calculateFactorial()" class="btn">x!</button>

    <button onclick="appendOperator('(')" class="btn">(</button>
    <button onclick="appendOperator(')')" class="btn">)</button>
    <button onclick="appendOperator('%')" class="btn">%</button>
    <button onclick="clearDisplay()" class="btn">C</button>
    
    </div>

    <div class="second">
    <button onclick="toggleInverse()" class="btn">Inv</button>
    <button onclick="calculateSin()" class="btn">Sin</button>
    <button onclick="calculateLn()" class="btn">Ln</button>
    <button onclick="appendNumber('7')">7</button>
    <button onclick="appendNumber('8')">8</button>
    <button onclick="appendNumber('9')">9</button>
    <button onclick="appendOperator('/')" class="btn">/</button>
    
</div>

    <div class="third">
    <button onclick="insertPi()" class="btn">π</button>
    <button onclick="calculateCos()" class="btn">Cos</button>
    <button onclick="calculateLog()" class="btn">Log</button>
    <button onclick="appendNumber('4')">4</button>
    <button onclick="appendNumber('5')">5</button>
    <button onclick="appendNumber('6')">6</button>
    <button onclick="appendOperator('*')" class="btn">x</button>
    
    </div>
    <div class="fourth"> 
    <button onclick="insertE()" class="btn">e</button>
    <button onclick="calculateTan()" class="btn">Tan</button>
    <button onclick="calculateSqrt()" class="btn">√</button>
    <button onclick="appendNumber('1')">1</button>
    <button onclick="appendNumber('2')">2</button>
    <button onclick="appendNumber('3')">3</button>
    <button onclick="appendOperator('-')" class="btn">-</button>
    
</div>
    <div class="fifth">
        
    <button onclick="calculateExp()" class="btn">Exp</button>
    <button onclick="appendOperator('**')" class="btn">x^y</button>
    <button onclick="calculateResult()" class="btn-equal">=</button>
    <button onclick="appendNumber('0')">0</button>
    <button onclick="appendOperator('.')" >.</button>
    <button onclick="deleteLast()" class="btn">←</button> 
    <button onclick="appendOperator('+')" class="btn">+</button>
    
    </div>
    </div>


    

    

   

    
    <script src="script.js"></script>
</body>
</html>
